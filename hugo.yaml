baseURL: "https://Audience07.github.io/"
locale: en-us
title: "My Blog"
theme: nerdy
security:
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^postcss$'
      - '^tailwindcss$'
disableKinds:
  - taxonomy
  - term
markup:
  tableOfContents:
    startLevel: 2
    endLevel: 3
  goldmark:
    renderer:
      unsafe: false
build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css
    - source: '(postcss|tailwind)\.config\.(js|mjs|ts)'
      target: css
module:
  mounts:
    - source: content
      target: content
    - source: data
      target: data
    - source: assets
      target: assets
    - source: static
      target: static
    - source: layouts
      target: layouts
    - source: i18n
      target: i18n
    - source: archetypes
      target: archetypes
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
